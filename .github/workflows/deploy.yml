name: Conflux AWS Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write
  contents: read

jobs:
  test-and-lint:
    name: Run Quality Gates & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conflux
          POSTGRES_PASSWORD: conflux_dev_pass
          POSTGRES_DB: conflux_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies & test
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install greenlet email-validator pytest pytest-asyncio
          pytest -v
        env:
          USE_FAKE_STORAGE_PROVIDER: "true"
          COOKIE_SECURE: "false"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Build Verification
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-to-aws:
    name: Build & Deploy to AWS Fargate
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set Image Tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Deploy / Update CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --template-file infra/aws/cloudformation-template.yaml \
            --stack-name conflux-infra-production \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
                EnvironmentName=production \
                DbPassword="${{ secrets.DB_MASTER_PASSWORD }}" \
                ImageTag="${{ steps.vars.outputs.IMAGE_TAG }}"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: conflux-api
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run Database Migrations on ECS
        run: |
          chmod +x infra/aws/run-migration.sh
          ./infra/aws/run-migration.sh production

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy Frontend to Amazon S3 & Invalidate CloudFront
        run: |
          S3_BUCKET=$(aws cloudformation describe-stacks --stack-name conflux-infra-production --query "Stacks[0].Outputs[?OutputKey=='FrontendS3Bucket'].OutputValue" --output text)
          CF_DIST_ID=$(aws cloudformation describe-stacks --stack-name conflux-infra-production --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          
          aws s3 sync frontend/dist/ s3://${S3_BUCKET}/ --delete
          aws cloudfront create-invalidation --distribution-id ${CF_DIST_ID} --paths "/*"

      - name: Trigger Rolling Deployment of ECS Services
        run: |
          aws ecs update-service --cluster conflux-cluster-production --service conflux-api-service-production --force-new-deployment
          aws ecs update-service --cluster conflux-cluster-production --service conflux-worker-service-production --force-new-deployment
