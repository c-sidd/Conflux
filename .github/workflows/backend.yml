name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Django Deployment Security
        env:
          SECRET_KEY: "ci-secret-key-testing-only"
          DATABASE_URL: "sqlite:///ci.sqlite3"
        run: |
          python backend/manage.py check --deploy

      - name: Run Django Tests
        env:
          SECRET_KEY: "ci-secret-key-testing-only"
          DATABASE_URL: "sqlite:///ci.sqlite3"
        run: |
          python backend/manage.py test apps.accounts apps.files apps.folders apps.storage --settings=dcs.settings
